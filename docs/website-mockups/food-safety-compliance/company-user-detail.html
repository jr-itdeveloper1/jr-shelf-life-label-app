<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Detail / Outlet Access - JR Label Cloud</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">JR Label Cloud</div>
    <div class="brand-sub">Food Safety Compliance</div>
    <nav><a class="" href="company-dashboard.html"><span>Dashboard</span></a><a class="" href="company-outlets.html"><span>Outlets</span></a><a class="" href="company-users.html"><span>Users</span></a><a class="" href="company-products.html"><span>Products</span></a><a class="" href="company-categories.html"><span>Categories</span></a><a class="" href="company-availability.html"><span>Availability</span></a><a class="" href="company-images.html"><span>Images</span></a><a class="" href="company-import-export.html"><span>Import/Export</span></a><a class="" href="company-audit-log.html"><span>Audit Log</span></a></nav>
    <div class="sidebar-footer">
      <label>
        <span>Role View</span>
        <select data-role-switch>
          <option value="company-dashboard.html" selected>Company Admin</option>
          <option value="site-dashboard.html" >Site Admin</option>
        </select>
      </label>
      <a href="login.html">Sign out</a>
    </div>
  </aside>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Company Admin</div>
        <h1>User Detail / Outlet Access</h1>
        <p>Role and permitted outlets</p>
      </div>
      <div class="top-actions">
        <label class="language-select"><span>Language</span><select><option>English</option></select></label>
        <span class="status ok">All synced</span>
        <span class="status ok">Audit enabled</span>
      </div>
    </header>
    <main class="content">
    <div class="toolbar"><button class="button primary" data-action="toast">Save User</button><button class="button" data-action="toast">Reset Password</button><button class="button warn" data-action="confirm-danger">Disable User</button></div>
    <section class="grid two">
      
    <section class="panel ">
      <div class="panel-head">
        <h2>User Profile</h2>
        
      </div>
      <div class="form-grid">
    <label>
      <span>Name</span>
      <input value="CK Shift Lead">
    </label>
  
    <label>
      <span>Email</span>
      <input value="cklead@jrfoods.example">
    </label>
  
    <label>
      <span>Role</span>
      <select><option>Outlet User</option><option>Active</option><option>Inactive</option><option>Disabled</option></select>
    </label>
  
    <label>
      <span>Status</span>
      <select><option>Active</option><option>Active</option><option>Inactive</option><option>Disabled</option></select>
    </label>
  </div>
    </section>
  
      
    <section class="panel ">
      <div class="panel-head">
        <h2>Outlet Access</h2>
        
      </div>
      
        <label class="check-row"><input type="checkbox" checked> Central Kitchen</label>
        <label class="check-row"><input type="checkbox"> Orchard Outlet</label>
        <label class="check-row"><input type="checkbox"> Tampines Outlet</label>
        <label class="check-row"><input type="checkbox"> Jurong Outlet</label>
      
    </section>
  
    </section>
  </main>
  </div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="assets/app.js"></script>
</body>
</html>

name: Android APK Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build and publish signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Derive Android version from tag
        id: version
        run: node scripts/derive-android-version.js "$GITHUB_REF_NAME"

      - name: Validate signing secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name must be configured as a repository secret."
              exit 1
            fi
          done

      - name: Decode signing keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PAPP_VERSION_NAME="${{ steps.version.outputs.version_name }}" \
            -PAPP_VERSION_CODE="${{ steps.version.outputs.version_code }}" \
            -PANDROID_UPLOAD_STORE_FILE="upload-keystore.jks" \
            -PANDROID_UPLOAD_KEYSTORE_PASSWORD="$ANDROID_UPLOAD_KEYSTORE_PASSWORD" \
            -PANDROID_UPLOAD_KEY_ALIAS="$ANDROID_UPLOAD_KEY_ALIAS" \
            -PANDROID_UPLOAD_KEY_PASSWORD="$ANDROID_UPLOAD_KEY_PASSWORD"

      - name: Prepare release assets
        id: asset
        run: |
          mkdir -p release-assets
          apk_name="jr-shelf-life-labels-${{ steps.version.outputs.version_name }}.apk"
          apk_path="release-assets/$apk_name"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk_path"
          sha256sum "$apk_path" > "$apk_path.sha256"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$apk_path.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          title="JR Shelf Life Labels $VERSION_NAME"
          notes="Signed Android APK built from commit $GITHUB_SHA."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "${{ steps.asset.outputs.apk_path }}" \
              "${{ steps.asset.outputs.checksum_path }}" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "${{ steps.asset.outputs.apk_path }}" \
              "${{ steps.asset.outputs.checksum_path }}" \
              --title "$title" \
              --notes "$notes"
          fi

services:
  postgres:
    image: postgres:16-alpine
    container_name: jr-label-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jr_labels
      POSTGRES_USER: jr_labels
      POSTGRES_PASSWORD: jr_labels_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jr_labels -d jr_labels"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: jr-label-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://jr_labels:jr_labels_password@postgres:5432/jr_labels?schema=public
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      APP_ENV: development
      ENABLE_DEMO_SEED: "true"
      REQUIRE_AUTH: "true"
      AUTH_TOKEN_SECRET: change-this-local-dev-secret
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web-admin:
    build:
      context: ./apps/web-admin
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: jr-label-web-admin
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      COOKIE_SECURE: "false"
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JR Label Cloud Wireframes</title>
  <style>
    
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --panel: #ffffff;
      --ink: #101828;
      --muted: #667085;
      --line: #d0d5dd;
      --accent: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .shell {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }
    .sidebar {
      background: #101828;
      color: #fff;
      padding: 28px 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }
    .brand {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 6px;
    }
    .sub {
      color: #98a2b3;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .nav-group {
      color: #98a2b3;
      font-size: 12px;
      font-weight: 800;
      margin: 24px 0 10px;
      text-transform: uppercase;
    }
    .nav-link {
      display: block;
      color: #eaecf0;
      padding: 9px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
    }
    .nav-link.active,
    .nav-link:hover {
      background: var(--accent);
      color: #fff;
      text-decoration: none;
    }
    main {
      padding: 32px;
      min-width: 0;
    }
    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.2;
    }
    .meta {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .button {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 12px;
      background: #fff;
      color: #344054;
      font-weight: 800;
      font-size: 13px;
    }
    .button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .mockup {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 24px;
    }
    .mockup img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid #eaecf0;
      background: #fff;
    }
    .sections {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }
    .card ul {
      margin: 0;
      padding-left: 18px;
      color: #475467;
      font-size: 14px;
      line-height: 1.55;
    }
    .card p {
      margin: 0;
      color: #475467;
      font-size: 14px;
      line-height: 1.55;
    }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { position: relative; height: auto; }
      .sections { grid-template-columns: 1fr; }
      main { padding: 20px; }
    }
  
    .shell { grid-template-columns: 1fr; }
    .hero {
      background: #101828;
      color: #fff;
      padding: 32px;
    }
    .hero h1 { color: #fff; }
    .hero p {
      margin: 0;
      color: #d0d5dd;
      font-weight: 700;
    }
    .index-main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px;
    }
    .group-title {
      margin: 28px 0 14px;
      font-size: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .index-card {
      background: #fff;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      overflow: hidden;
    }
    .index-card a {
      color: #101828;
      display: block;
      text-decoration: none;
    }
    .index-card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: contain;
      background: #f9fafb;
      border-bottom: 1px solid #eaecf0;
    }
    .index-card span {
      display: block;
      padding: 12px 14px;
      font-weight: 900;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>JR Label Cloud Wireframes / 页面示意图索引</h1>
    <p>Open this file directly in a browser to review all generated SVG mockups and page specs.</p>
  </header>
  <main class="index-main">
    <div class="actions">
      <a class="button primary" href="../admin-web-page-wireframes.md">Open Markdown Index</a>
      <a class="button" href="README.md">Open Wireframes README</a>
      <a class="button primary" href="style-options/index.html">Open Style Options</a>
    </div>
    <h2 class="group-title">Site Admin Pages / 平台管理员页面</h2>
    <section class="grid"></section>
    <h2 class="group-title">Company Admin Pages / 公司管理员页面</h2>
    <section class="grid"></section>
    <h2 class="group-title">Mobile Cloud-Sync Pages / 移动端云同步页面</h2>
    <section class="grid"></section>
  </main>
</body>
</html>
